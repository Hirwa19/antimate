<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan & Neon Blue Gradients -->
    <linearGradient id="mainGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <!-- Light Blur Filter (Iyigabanyije kugira ngo ibe Sharp) -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="500" height="500" rx="40" fill="#FFFFFF" />

  <!-- LOGO GROUP (Yaguye mu ngano / Scaled Up) -->
  <g filter="url(#softGlow)">
    <!-- ANTIMATE Outer "A" Shape (Size nini) -->
    <path
      d="M250 40 L395 325 L340 325 L250 145 L160 325 L105 325 Z"
      fill="url(#mainGlowGrad)"
    />

    <!-- ANTIMATE Inner Diagonal Bar -->
    <path
      d="M220 238 L250 180 L310 300 L265 300 Z"
      fill="url(#mainGlowGrad)"
    />

    <!-- ANTIMATE Typography (Nini kandi irasobanutse neza) -->
    <g fill="url(#mainGlowGrad)">
      <!-- A -->
      <path d="M70 420 L91 365 L112 420 L100 420 L91 395 L82 420 Z" />
      <!-- N -->
      <path d="M125 365 H136 L158 404 V365 H168 V420 H157 L135 381 V420 H125 Z" />
      <!-- T -->
      <path d="M180 365 H214 V375 H202 V420 H191 V375 H180 Z" />
      <!-- I -->
      <path d="M226 365 H237 V420 H226 Z" />
      <!-- M -->
      <path d="M250 365 H260 L272 396 L284 365 H294 V420 H284 V386 L275 409 H269 L260 386 V420 H250 Z" />
      <!-- A -->
      <path d="M308 420 L329 365 L350 420 L338 420 L329 395 L320 420 Z" />
      <!-- T -->
      <path d="M362 365 H396 V375 H384 V420 H373 V375 H362 Z" />
      <!-- E -->
      <path d="M408 365 H438 V375 H419 V387 H435 V397 H419 V410 H438 V420 H408 Z" />
    </g>
  </g>
</svg>
