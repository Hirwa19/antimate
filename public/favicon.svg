<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Modern Tech Cyan Gradients -->
    <linearGradient id="mainGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00aaff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <linearGradient id="glowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0.3" />
    </linearGradient>

    <!-- Futuristic Neon Lighting Effect -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Tech Background Layer -->
  <rect width="500" height="500" rx="40" fill="#030712" />

  <g filter="url(#neonBlur)">
    <!-- ANTIMATE Outer "A" Shape -->
    <path
      d="M250 80 L370 320 L325 320 L250 170 L175 320 L130 320 Z"
      fill="url(#mainGlowGrad)"
    />

    <!-- ANTIMATE Inner Diagonal Bar -->
    <path
      d="M225 248 L250 200 L300 300 L262 300 Z"
      fill="url(#mainGlowGrad)"
    />

    <!-- ANTIMATE Futuristic Typography -->
    <g fill="url(#mainGlowGrad)">
      <!-- A -->
      <path d="M90 410 L107 370 L123 410 L114 410 L107 392 L100 410 Z" />
      <!-- N -->
      <path d="M135 370 H143 L160 398 V370 H168 V410 H160 L143 382 V410 H135 Z" />
      <!-- T -->
      <path d="M178 370 H204 V377 H195 V410 H187 V377 H178 Z" />
      <!-- I -->
      <path d="M214 370 H222 V410 H214 Z" />
      <!-- M -->
      <path d="M232 370 H240 L249 392 L258 370 H266 V410 H258 V385 L251 402 H247 L240 385 V410 H232 Z" />
      <!-- A -->
      <path d="M276 410 L293 370 L309 410 L300 410 L293 392 L286 410 Z" />
      <!-- T -->
      <path d="M318 370 H344 V377 H335 V410 H327 V377 H318 Z" />
      <!-- E -->
      <path d="M354 370 H378 V377 H362 V386 H375 V393 H362 V403 H378 V410 H354 Z" />
    </g>
  </g>
</svg>
